name: Citizens Stage3 Test Build

on:
  push:
    branches:
      - citizens-stage3-test
    paths:
      - 'citizens-stage3/**'
      - '.github/workflows/citizens-stage3-test.yml'
  pull_request:
    branches:
      - citizens-stage3-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: citizens-stage3-test
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone exact Citizens baseline
        run: |
          rm -rf citizens-src
          git clone https://github.com/CitizensDev/Citizens2.git citizens-src
          cd citizens-src
          git checkout 979f203909741f3f5bc459d64aec6d497e0a2c29
          git status --short

      - name: Apply Fresita Stage 1-3 only
        run: |
          python3 citizens-stage3/apply_stage3.py citizens-src
          python3 citizens-stage3/fix_modern_only.py citizens-src
          grep -R "SpigotPacketEventsBuilder\|PacketEvents.getAPI().init()\|packet.write();\|EntityDataTypes.STRING" \
            citizens-src/main/src/main/java/net/citizensnpcs/Citizens.java \
            citizens-src/main/src/main/java/net/citizensnpcs/PacketEventsHook.java && exit 1 || true

      - name: Restrict distribution to Paper 26.1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('citizens-src/dist/pom.xml')
          text = p.read_text()
          start = text.index('<id>spigot-release</id>')
          end = text.index('</profile>', start)
          profile = text[start:end]
          pattern = r'''\s*<dependency>\s*<groupId>\$\{project\.groupId\}</groupId>\s*<artifactId>citizens-v26_2_R1</artifactId>\s*<version>\$\{project\.version\}</version>\s*<type>jar</type>\s*<scope>compile</scope>\s*</dependency>'''
          profile2, count = re.subn(pattern, '', profile, count=1)
          if count != 1:
              raise SystemExit(f'Expected one v26_2_R1 dependency in spigot-release profile, got {count}')
          p.write_text(text[:start] + profile2 + text[end:])
          print('Removed v26_2_R1 from test distribution only')
          PY

      - name: Build Citizens 2.0.43 b4232 Stage3 for 26.1
        id: stage3_build
        working-directory: citizens-src
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/citizens-stage3/debug"
          set +e
          mvn -pl dist -am -Pspigot-release -DskipTests -Dmaven.javadoc.skip=true -DBUILD_NUMBER=4232 clean package 2>&1 | tee "$GITHUB_WORKSPACE/citizens-stage3/debug/build.log"
          MAVEN_EXIT=${PIPESTATUS[0]}
          set -e
          grep -E '(^\[ERROR\]|COMPILATION ERROR|cannot find symbol|BUILD FAILURE|Failed to execute goal|Could not resolve|Non-resolvable|Could not find artifact|package .* does not exist)' \
            "$GITHUB_WORKSPACE/citizens-stage3/debug/build.log" \
            | tail -n 160 > "$GITHUB_WORKSPACE/citizens-stage3/debug/build-error.txt" || true
          echo "maven_exit=$MAVEN_EXIT" >> "$GITHUB_OUTPUT"
          echo "Maven exit code: $MAVEN_EXIT"

      - name: Upload concise Maven failure
        if: steps.stage3_build.outputs.maven_exit != '0'
        uses: actions/upload-artifact@v4
        with:
          name: citizens-stage3-build-error
          path: |
            citizens-stage3/debug/build-error.txt
            citizens-stage3/debug/build.log

      - name: Stop on Maven failure
        if: steps.stage3_build.outputs.maven_exit != '0'
        run: |
          echo 'Citizens Stage3 Maven build failed. Concise error follows:'
          cat citizens-stage3/debug/build-error.txt
          exit 1

      - name: Locate and verify JAR
        if: steps.stage3_build.outputs.maven_exit == '0'
        run: |
          set -eux
          JAR="citizens-src/dist/target/Citizens-2.0.43-b4232.jar"
          test -f "$JAR"
          mkdir -p citizens-stage3/build
          cp "$JAR" citizens-stage3/build/Citizens-2.0.43-b4232-FRESITA-STAGE3.jar
          sha256sum citizens-stage3/build/Citizens-2.0.43-b4232-FRESITA-STAGE3.jar > citizens-stage3/build/SHA256.txt
          unzip -p citizens-stage3/build/Citizens-2.0.43-b4232-FRESITA-STAGE3.jar plugin.yml | head -n 20
          unzip -l citizens-stage3/build/Citizens-2.0.43-b4232-FRESITA-STAGE3.jar | grep 'v26_1_R1' | head
          if unzip -l citizens-stage3/build/Citizens-2.0.43-b4232-FRESITA-STAGE3.jar | grep -q 'v26_2_R1'; then
            echo 'Unexpected v26_2_R1 classes in 26.1 test JAR'
            exit 1
          fi
          cat citizens-stage3/build/SHA256.txt

      - name: Upload fallback artifact
        if: steps.stage3_build.outputs.maven_exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: citizens-stage3-test
          path: |
            citizens-stage3/build/Citizens-2.0.43-b4232-FRESITA-STAGE3.jar
            citizens-stage3/build/SHA256.txt

      - name: Publish test JAR to branch
        if: steps.stage3_build.outputs.maven_exit == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f citizens-stage3/build/Citizens-2.0.43-b4232-FRESITA-STAGE3.jar citizens-stage3/build/SHA256.txt
          if git diff --cached --quiet; then
            echo "No build output changes"
            exit 0
          fi
          git commit -m "Publish Citizens Stage3 test build [skip ci]"
          git push origin HEAD:citizens-stage3-test
