name: Citizens Stage3 Test Build

on:
  push:
    branches:
      - citizens-stage3-test
    paths:
      - 'citizens-stage3/**'
      - '.github/workflows/citizens-stage3-test.yml'
  pull_request:
    branches:
      - citizens-stage3-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: citizens-stage3-test
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Clone exact Citizens b4232 source
        run: |
          rm -rf citizens-src
          git clone https://github.com/CitizensDev/Citizens2.git citizens-src
          cd citizens-src
          git checkout 979f203909741f3f5bc459d64aec6d497e0a2c29
          test "$(git rev-parse HEAD)" = "979f203909741f3f5bc459d64aec6d497e0a2c29"

      - name: Apply Fresita Stage 1-3 only
        run: |
          python3 citizens-stage3/apply_stage3.py citizens-src
          python3 citizens-stage3/fix_modern_only.py citizens-src
          grep -R "SpigotPacketEventsBuilder\|PacketEvents.getAPI().init()\|packet.write();\|EntityDataTypes.STRING" \
            citizens-src/main/src/main/java/net/citizensnpcs/Citizens.java \
            citizens-src/main/src/main/java/net/citizensnpcs/PacketEventsHook.java && exit 1 || true

      - name: Make citizens-main compile against Paper 26.1.2 only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('citizens-src/main/pom.xml')
          text = p.read_text()

          old_paper = '<paper.version>[26.2.build,)</paper.version>'
          new_paper = '<paper.version>26.1.2.build.74-stable</paper.version>'
          if text.count(old_paper) != 1:
              raise SystemExit(f'Expected one Paper 26.2 property, got {text.count(old_paper)}')
          text = text.replace(old_paper, new_paper, 1)

          pattern = re.compile(
              r'''\s*<dependency>\s*<groupId>org\.spigotmc</groupId>\s*<artifactId>spigot</artifactId>\s*<version>\$\{craftbukkit\.version\}</version>\s*<scope>provided</scope>\s*</dependency>''',
              re.MULTILINE)
          text, count = pattern.subn('', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one unavailable Spigot dependency, got {count}')

          p.write_text(text)
          print('citizens-main now compiles against Paper 26.1.2 build 74; NMS modules are not rebuilt')
          PY

      - name: Download exact official Citizens b4232 base
        run: |
          set -euxo pipefail
          mkdir -p citizens-stage3/base
          URL='https://ci.citizensnpcs.co/job/Citizens2/4232/artifact/dist/target/Citizens-2.0.43-b4232.jar'
          BASE='citizens-stage3/base/Citizens-2.0.43-b4232.jar'
          curl --fail --location --retry 3 --retry-delay 2 "$URL" -o "$BASE"
          test "$(stat -c '%s' "$BASE")" = '4367892'
          unzip -p "$BASE" plugin.yml | grep -E '^version:|^name:'
          zipinfo -1 "$BASE" > citizens-stage3/base/entries.txt
          grep 'net/citizensnpcs/nms/v26_1_R1/' citizens-stage3/base/entries.txt | sed -n '1,10p'
          sha256sum "$BASE" | tee citizens-stage3/base/SHA256-OFFICIAL.txt

      - name: Build patched citizens-main only
        id: overlay_build
        working-directory: citizens-src
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/citizens-stage3/debug"
          set +e
          mvn -pl main -am -DskipTests -Dmaven.javadoc.skip=true -DBUILD_NUMBER=4232 clean package \
            2>&1 | tee "$GITHUB_WORKSPACE/citizens-stage3/debug/build.log"
          MAVEN_EXIT=${PIPESTATUS[0]}
          set -e
          grep -E '(^\[ERROR\]|COMPILATION ERROR|cannot find symbol|BUILD FAILURE|Failed to execute goal|Could not resolve|Non-resolvable|Could not find artifact|package .* does not exist|bad class file|class file has wrong version)' \
            "$GITHUB_WORKSPACE/citizens-stage3/debug/build.log" \
            | tail -n 200 > "$GITHUB_WORKSPACE/citizens-stage3/debug/build-error.txt" || true
          echo "maven_exit=$MAVEN_EXIT" >> "$GITHUB_OUTPUT"
          echo "Maven exit code: $MAVEN_EXIT"

      - name: Upload concise overlay build failure
        if: steps.overlay_build.outputs.maven_exit != '0'
        uses: actions/upload-artifact@v4
        with:
          name: citizens-stage3-overlay-build-error
          path: |
            citizens-stage3/debug/build-error.txt
            citizens-stage3/debug/build.log

      - name: Stop on overlay build failure
        if: steps.overlay_build.outputs.maven_exit != '0'
        run: |
          echo 'citizens-main overlay build failed. Concise error follows:'
          cat citizens-stage3/debug/build-error.txt
          exit 1

      - name: Overlay only Stage3 class families onto official b4232
        if: steps.overlay_build.outputs.maven_exit == '0'
        run: |
          set -euxo pipefail
          BASE="$GITHUB_WORKSPACE/citizens-stage3/base/Citizens-2.0.43-b4232.jar"
          OUT="$GITHUB_WORKSPACE/citizens-stage3/build/Citizens-2.0.43-b4232-FRESITA-STAGE3.jar"
          CLASSES="$GITHUB_WORKSPACE/citizens-src/main/target/classes"
          mkdir -p "$GITHUB_WORKSPACE/citizens-stage3/build"
          cp "$BASE" "$OUT"

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          base = Path('citizens-stage3/base/Citizens-2.0.43-b4232.jar')
          classes = Path('citizens-src/main/target/classes')
          names = []
          for rel in [
              Path('net/citizensnpcs/Citizens.class'),
              Path('net/citizensnpcs/PacketEventsHook.class'),
              Path('net/citizensnpcs/trait/HologramTrait.class'),
          ]:
              parent = classes / rel.parent
              stem = rel.stem
              names.extend(
                  p.relative_to(classes).as_posix()
                  for p in parent.glob(stem + '*.class')
                  if p.name == stem + '.class' or p.name.startswith(stem + '$')
              )
          names = sorted(set(names))
          if not names:
              raise SystemExit('No compiled Stage3 class files found')

          with ZipFile(base) as z:
              base_names = set(z.namelist())
          existing = sorted(n for n in names if n in base_names)
          missing_in_base = sorted(set(names) - base_names)
          if missing_in_base:
              raise SystemExit('Compiled overlay introduced unexpected class files: ' + ', '.join(missing_in_base))

          def targeted(n):
              return (
                  n == 'net/citizensnpcs/Citizens.class' or n.startswith('net/citizensnpcs/Citizens$') or
                  n == 'net/citizensnpcs/PacketEventsHook.class' or n.startswith('net/citizensnpcs/PacketEventsHook$') or
                  n == 'net/citizensnpcs/trait/HologramTrait.class' or n.startswith('net/citizensnpcs/trait/HologramTrait$')
              ) and n.endswith('.class')
          baseline_target = sorted(n for n in base_names if targeted(n))
          if baseline_target != existing:
              missing = sorted(set(baseline_target) - set(existing))
              extra = sorted(set(existing) - set(baseline_target))
              raise SystemExit(f'Overlay class family mismatch. Missing={missing} Extra={extra}')

          Path('citizens-stage3/build/replacements.txt').write_text('\n'.join(existing) + '\n')
          print(f'Validated {len(existing)} exact Stage3 class replacements')
          PY

          while IFS= read -r classfile; do
            zip -q -d "$OUT" "$classfile"
          done < "$GITHUB_WORKSPACE/citizens-stage3/build/replacements.txt"

          cd "$CLASSES"
          while IFS= read -r classfile; do
            jar uf "$OUT" "$classfile"
          done < "$GITHUB_WORKSPACE/citizens-stage3/build/replacements.txt"

      - name: Verify binary overlay and untouched NMS
        if: steps.overlay_build.outputs.maven_exit == '0'
        run: |
          set -euxo pipefail
          BASE='citizens-stage3/base/Citizens-2.0.43-b4232.jar'
          OUT='citizens-stage3/build/Citizens-2.0.43-b4232-FRESITA-STAGE3.jar'

          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile

          base = Path('citizens-stage3/base/Citizens-2.0.43-b4232.jar')
          out = Path('citizens-stage3/build/Citizens-2.0.43-b4232-FRESITA-STAGE3.jar')
          replacements = set(Path('citizens-stage3/build/replacements.txt').read_text().splitlines())

          def hashes(path):
              result = {}
              with ZipFile(path) as z:
                  for info in z.infolist():
                      if info.is_dir():
                          continue
                      if info.filename in result:
                          raise SystemExit(f'Duplicate ZIP entry in {path}: {info.filename}')
                      result[info.filename] = hashlib.sha256(z.read(info.filename)).hexdigest()
              return result

          a = hashes(base)
          b = hashes(out)
          if set(a) != set(b):
              raise SystemExit(f'JAR entry set changed unexpectedly: removed={sorted(set(a)-set(b))} added={sorted(set(b)-set(a))}')

          unexpected = [n for n in a if n not in replacements and a[n] != b[n]]
          if unexpected:
              raise SystemExit('Non-Stage3 JAR contents changed: ' + ', '.join(unexpected[:20]))

          unchanged_targets = [n for n in replacements if a[n] == b[n]]
          if unchanged_targets:
              raise SystemExit('Expected patched class did not change: ' + ', '.join(unchanged_targets))

          nms = [n for n in a if n.startswith('net/citizensnpcs/nms/v26_1_R1/')]
          if not nms:
              raise SystemExit('No v26_1_R1 classes found in official base')
          if any(a[n] != b[n] for n in nms):
              raise SystemExit('v26_1_R1 NMS content changed')

          print(f'Verified: only {len(replacements)} Stage3 class files changed; {len(nms)} v26_1_R1 entries are byte-identical')
          PY

          javap -classpath "$OUT" -p -c net.citizensnpcs.Citizens > citizens-stage3/build/Citizens.javap.txt
          javap -classpath "$OUT" -p -c net.citizensnpcs.PacketEventsHook > citizens-stage3/build/PacketEventsHook.javap.txt
          javap -classpath "$OUT" -p -c net.citizensnpcs.trait.HologramTrait > citizens-stage3/build/HologramTrait.javap.txt

          if grep -q 'SpigotPacketEventsBuilder\|PacketEvents.setAPI\|PacketEvents.*terminate' citizens-stage3/build/Citizens.javap.txt; then
            echo 'Forbidden PacketEvents ownership call remains in Citizens bytecode'
            exit 1
          fi
          if grep -q 'PacketEvents.*init\|packet.write' citizens-stage3/build/PacketEventsHook.javap.txt; then
            echo 'Forbidden PacketEvents init/write call remains in PacketEventsHook bytecode'
            exit 1
          fi
          grep -q 'unregisterListeners' citizens-stage3/build/PacketEventsHook.javap.txt
          grep -q 'markForReEncode' citizens-stage3/build/PacketEventsHook.javap.txt

          unzip -p "$OUT" plugin.yml | grep -E '^version:|^name:'
          sha256sum "$OUT" | tee citizens-stage3/build/SHA256.txt

      - name: Upload patched Citizens Stage3 artifact
        if: steps.overlay_build.outputs.maven_exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: citizens-stage3-test
          path: |
            citizens-stage3/build/Citizens-2.0.43-b4232-FRESITA-STAGE3.jar
            citizens-stage3/build/SHA256.txt
            citizens-stage3/build/replacements.txt
            citizens-stage3/build/Citizens.javap.txt
            citizens-stage3/build/PacketEventsHook.javap.txt
            citizens-stage3/build/HologramTrait.javap.txt

      - name: Publish test JAR to branch
        if: steps.overlay_build.outputs.maven_exit == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            citizens-stage3/build/Citizens-2.0.43-b4232-FRESITA-STAGE3.jar \
            citizens-stage3/build/SHA256.txt \
            citizens-stage3/build/replacements.txt
          if git diff --cached --quiet; then
            echo 'No build output changes'
            exit 0
          fi
          git commit -m 'Publish Citizens b4232 Stage3 overlay [skip ci]'
          git push origin HEAD:citizens-stage3-test
